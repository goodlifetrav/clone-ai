services:
  cloneai:
    build:
      context: .
      dockerfile: Dockerfile
    # Bind to 127.0.0.1 so port 3000 is not reachable from the public
    # internet — nginx (also on this host) reverse-proxies to it.
    # Previously "3000:3000" bound to 0.0.0.0, bypassing nginx (and its
    # rate limits, TLS, and security headers) for anyone hitting the VPS
    # IP directly on port 3000.
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped
    command: ["sh", "startup.sh"]
    # No playwright-cache volume — Chromium is baked into the Docker image layer.
    # Mounting a volume at /root/.cache/ms-playwright would shadow the baked
    # browsers and force a re-download on every fresh container.
