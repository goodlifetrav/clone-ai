# DOCS: this file is reproduced from /etc/nginx/conf.d/00-rate-limits.conf
# on the production server. It must live in http {} context — that's why it
# lives under /etc/nginx/conf.d/ on the box rather than alongside the main
# server config in /etc/nginx/sites-enabled/.
#
# Rates here act as defense in depth on top of lib/rate-limit.ts (which
# does per-user limits in-process). nginx limits are deliberately set
# above the app limits so legitimate users aren't blocked twice; the
# goal is to absorb floods at the edge.

limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=clone_zone:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=chat_zone:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=300r/m;
